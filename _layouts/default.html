<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo title=false %}
  <title>{% if page.title and page.title != site.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% if site.goatcounter_code and site.goatcounter_code != "" %}
  <script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  {% endif %}
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>

  {% include header.html %}

  <main id="main-content"{% if page.wide %} class="wide"{% endif %}>
    {{ content }}
  </main>

  {% include footer.html %}

</body>
</html>
