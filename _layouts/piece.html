---
layout: default
---
<a href="{{ page.back_url | relative_url }}" class="back-link">&larr; {{ page.back_label }}</a>

<div class="piece-header">
  <h1>{{ page.title }}</h1>
  <div class="entry-meta">{% if page.date_label %}{{ page.date_label }}{% else %}{{ page.date | date: "%B %Y" }}{% endif %}</div>
</div>

<div class="piece-body">
  {{ content }}
</div>
